# Nginx Configuration for bridge.netsights.ai
# Place this file at: /etc/nginx/sites-available/bridge.netsights.ai

# HTTP Server (redirects to HTTPS or serves directly)
server {
    listen 80;
    server_name bridge.netsights.ai;

    # Option 1: Redirect to HTTPS (uncomment if you have SSL)
    # return 301 https://$server_name$request_uri;

    # Option 2: Serve directly on HTTP (current setup)
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

