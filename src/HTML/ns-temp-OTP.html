<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netsights Email Template</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #f9fafb;
            padding: 20px;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(to right, #ffffff, #f9fafb);
            padding: 24px 32px;
            border-bottom: 4px solid #5DBBB8;
        }

        .header img {
            height: 48px;
            object-fit: contain;
        }

        .content {
            padding: 40px 32px;
            background-color: white;
        }

        .content h2 {
            font-size: 24px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .accent-line {
            width: 64px;
            height: 4px;
            background-color: #5DBBB8;
            border-radius: 2px;
            margin-bottom: 24px;
        }

        .content p {
            color: #374151;
            line-height: 1.625;
            margin-bottom: 16px;
        }

        .highlight-box {
            background: linear-gradient(to bottom right, rgba(93, 187, 184, 0.05), rgba(93, 187, 184, 0.1));
            border-left: 4px solid #5DBBB8;
            border-radius: 0 8px 8px 0;
            padding: 24px;
            margin: 24px 0;
        }

        .highlight-box h3 {
            font-weight: 600;
            color: #111827;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .highlight-box ul {
            list-style: none;
        }

        .highlight-box li {
            color: #374151;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            line-height: 1.5;
        }

        .highlight-box li span:first-child {
            color: #5DBBB8;
            margin-right: 8px;
            margin-top: 4px;
            font-weight: bold;
        }

        .cta-button {
            display: inline-block;
            background-color: #5DBBB8;
            color: white;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin: 32px 0;
        }

        .cta-button:hover {
            background-color: #4da9a6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .footer {
            background: linear-gradient(to right, #f9fafb, #f3f4f6);
            padding: 24px 32px;
            border-top: 1px solid #e5e7eb;
        }

        .footer-contact {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #4b5563;
        }

        .footer-contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-contact-item svg {
            width: 16px;
            height: 16px;
            color: #5DBBB8;
            flex-shrink: 0;
        }

        .footer-info {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            line-height: 1.6;
        }

        .footer-location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .footer-location svg {
            width: 12px;
            height: 12px;
            color: #5DBBB8;
        }

        .footer-divider {
            border-top: 1px solid #d1d5db;
            margin: 12px 0;
            padding-top: 8px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding-top: 8px;
        }

        .footer-links a {
            color: #5DBBB8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #4da9a6;
        }

        .footer-separator {
            color: #d1d5db;
        }

        @media (max-width: 600px) {
            .email-container {
                border-radius: 0;
            }

            .content {
                padding: 24px 20px;
            }

            .header {
                padding: 20px 20px;
            }

            .footer {
                padding: 20px 20px;
            }

            .footer-contact {
                gap: 16px;
            }

            .content h2 {
                font-size: 20px;
            }
        }
      
    </style>
</head>
