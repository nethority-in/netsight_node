<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Sign In</title>
  <style>
    :root {
      --bg: #0c1117;
      --surface: #151b24;
      --surface2: #1c2430;
      --border: #2a3544;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #22d3ee;
      --accent-dim: #0891b2;
      --err: #f87171;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, #132032 0%, var(--bg) 55%);
      color: var(--text);
      padding: 1rem;
    }
    .card {
      width: min(420px, 96vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0; font-size: 1.05rem; }
    p { margin: 0.45rem 0 0.9rem; color: var(--muted); font-size: 0.85rem; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.25rem; }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .field + .field { margin-top: 0.65rem; }
    .actions { margin-top: 0.9rem; display: flex; justify-content: flex-end; }
    button {
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(165deg, var(--accent), var(--accent-dim));
      color: #041014;
    }
    .error {
      min-height: 1rem;
      margin-top: 0.6rem;
      color: var(--err);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <form class="card" id="signin-form">
    <h1>Netsight Dashboard Sign In</h1>
    <p>Enter dashboard credentials to continue.</p>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
    </div>
    <div class="error" id="error"></div>
    <div class="actions">
      <button type="submit" id="submit-btn">Sign In</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('signin-form');
    const err = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      err.textContent = '';
      submitBtn.disabled = true;
      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const r = await fetch('/dashboard/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j?.error || 'Invalid credentials');
        window.location.href = '/dashboard';
      } catch (e) {
        err.textContent = e instanceof Error ? e.message : String(e);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
